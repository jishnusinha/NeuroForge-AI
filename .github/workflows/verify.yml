name: Verify NeuroForge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04 # Stable image; host kernel still needs Mongo compatibility checks
    timeout-minutes: 70
    services:
      mongo:
        image: mongo:7.0
        # Mongo 8 refuses to start on hosted Linux kernels 6.19–7.0.13 (SERVER-121912).
        # Use supported Mongo 7 for CI until the runner and Mongo 8 combination is safe.
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEUROFORGE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - name: Verify theme contrast and scientific chart palette behavior
        run: node scripts/verify-theme-contract.mjs
      - name: Guard public copy against internal phase labels
        run: node scripts/verify-public-copy.mjs
      - run: npm --prefix client ci
      - run: npm --prefix server ci
      - run: npx playwright install --with-deps chromium
      - name: Benchmark the production CSV worker at the 100 MiB limit
        run: npm run benchmark:csv:browser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 numpy==2.2.6 matplotlib==3.10.3 seaborn==0.13.2
      - run: node scripts/export-python-chart-fixtures.mjs
      - run: python scripts/verify-python-charts.py
      - name: Install pinned CPU PyTorch for reviewed learning examples
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install scikit-learn==1.7.2
      - name: Execute all ten Academy Python examples
        run: node scripts/export-academy-code-fixtures.mjs && python scripts/verify-academy-code.py && node scripts/verify-academy-javascript.mjs
      - run: node scripts/export-learning-code-fixtures-f22.mjs
      - run: python scripts/verify-learning-code-f22.py
      - run: node scripts/export-optimization-fixtures-f22.mjs
      - run: python scripts/verify-optimization-f22.py
      - run: npm run check
      - run: npm run test:e2e:memory
      - run: npm run audit:f21
      - name: Build isolated F21 static demo
        run: npm --prefix client run build -- --outDir ../.artifacts/f21/pages-build
        env:
          GITHUB_PAGES: 'true'
          VITE_STATIC_DEMO: 'true'
      - run: npm run verify:pages:f21
      - run: node scripts/verify-learning-pages-f22.mjs .artifacts/f21/pages-build
      - run: npm run baseline:summary
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: .artifacts/
          include-hidden-files: true
          retention-days: 30
